<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Salles Blanches - ÉTS</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #0056b3; color: white; }
        
        .chart-card {
            background: white; 
            padding: 15px; 
            border: 1px solid #ddd; 
            border-radius: 5px;
            width: 100%;
        }
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
        
        .controls {
            background: white;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        input[type="date"] {
            padding: 6px;
            font-size: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
            cursor: pointer;
        }
        button {
            padding: 8px 15px;
            font-size: 14px;
            background: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #004085;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Monitoring Qualité d'Air</h1>
    
    <div id="status" style="color: #666; font-style: italic; margin-bottom: 20px;">Connexion en cours...</div>

    <div style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
        <div style="background: white; padding: 15px; border: 1px solid #ddd; border-radius: 5px;">🌡️ Temp: <strong id="val-temp">—</strong> °C</div>
        <div style="background: white; padding: 15px; border: 1px solid #ddd; border-radius: 5px;">💧 Hum: <strong id="val-hum">—</strong> %</div>
        <div style="background: white; padding: 15px; border: 1px solid #ddd; border-radius: 5px;">🌫️ PM 2.5: <strong id="val-mc2p5">—</strong> µg/m³</div>
        <div style="background: white; padding: 15px; border: 1px solid #ddd; border-radius: 5px;">🌫️ PM 10: <strong id="val-mc10p0">—</strong> µg/m³</div>
    </div>

    <div class="controls">
        <div>
            <label for="dateDebut"><strong>Du : </strong></label>
            <input type="date" id="dateDebut" onchange="fetchData()">
        </div>
        <div>
            <label for="dateFin"><strong>Au : </strong></label>
            <input type="date" id="dateFin" onchange="fetchData()">
        </div>
        
        <div>
            <label for="selectRoom"><strong>Salle : </strong></label>
            <select id="selectRoom" onchange="fetchData()" style="padding: 6px; border-radius: 4px;">
                <option value="1">Salle 1</option>
                <option value="2">Salle 2</option>
                <option value="3">Salle 3</option>
            </select>
        </div>
        <div>
            <label for="selectCapteur"><strong>Capteur : </strong></label>
            <select id="selectCapteur" onchange="fetchData()" style="padding: 6px; border-radius: 4px;">
                <option value="all">Moyenne de la salle</option>
                <option value="1">Capteur 1</option>
                <option value="2">Capteur 2</option>
                <option value="3">Capteur 3</option>
                <option value="4">Capteur 4</option>
            </select>
        </div>

        <button onclick="reinitialiserDates()">Effacer les filtres</button>
    </div> 

    <!-- AJOUT DU CONTENEUR MANQUANT -->
    <div style="display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px;">
        <div class="chart-card">
            <h2>Température & Humidité</h2>
            <div class="chart-container">
                <canvas id="chartTempHum"></canvas>
            </div>
        </div>

        <div class="chart-card">
            <h2>Concentration Massique en µg/m³ (PM)</h2>
            <div class="chart-container">
                <canvas id="chartPM"></canvas>
            </div>
        </div>

        <div class="chart-card">
            <h2>Nombre de Particules (NC)</h2>
            <div class="chart-container">
                <canvas id="chartNC"></canvas>
            </div>
        </div>
    </div>

    <h2>Historique des mesures</h2>
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Salle</th>
                <th>Esclave</th>
                <th>Température</th>
                <th>Humidité</th>
                <th>PM 2.5</th>
                <th>PM 10</th>
            </tr>
        </thead>
        <tbody id="tableau-mesures">
        </tbody>
    </table>

    <script>
        const REFRESH_MS = 10000; 
        let chartTempHum, chartPM, chartNC;

        const chartOptions = { 
            responsive: true, 
            maintainAspectRatio: false,
            animation: { duration: 200 }
        };

        // Sécurisation : On attend que le HTML soit totalement chargé
        document.addEventListener("DOMContentLoaded", () => {
            chartTempHum = new Chart(document.getElementById("chartTempHum"), {
                type: "line",
                data: { labels: [], datasets: [
                    { label: "Température (°C)", data: [], borderColor: "#f97316", backgroundColor: "rgba(249,115,22,0.1)", tension: 0.3, fill: true, pointRadius: 1 },
                    { label: "Humidité (%)",     data: [], borderColor: "#38bdf8", backgroundColor: "rgba(56,189,248,0.1)",  tension: 0.3, fill: true, pointRadius: 1 },
                ]}, options: chartOptions
            });

            chartPM = new Chart(document.getElementById("chartPM"), {
                type: "line",
                data: { labels: [], datasets: [
                    { label: "PM1.0",  data: [], borderColor: "#a78bfa", tension: 0.3, pointRadius: 1 },
                    { label: "PM2.5",  data: [], borderColor: "#34d399", tension: 0.3, pointRadius: 1 },
                    { label: "PM4.0",  data: [], borderColor: "#fbbf24", tension: 0.3, pointRadius: 1 },
                    { label: "PM10",   data: [], borderColor: "#f87171", tension: 0.3, pointRadius: 1 },
                ]}, options: chartOptions
            });

            chartNC = new Chart(document.getElementById("chartNC"), {
                type: "line",
                data: { labels: [], datasets: [
                    { label: "NC0.5",  data: [], borderColor: "#6366f1", tension: 0.3, pointRadius: 1 },
                    { label: "NC1.0",  data: [], borderColor: "#8b5cf6", tension: 0.3, pointRadius: 1 },
                    { label: "NC2.5",  data: [], borderColor: "#d946ef", tension: 0.3, pointRadius: 1 },
                    { label: "NC4.0",  data: [], borderColor: "#ec4899", tension: 0.3, pointRadius: 1 },
                    { label: "NC10",   data: [], borderColor: "#eab308", tension: 0.3, pointRadius: 1 },
                ]}, options: chartOptions
            });

            fetchData();
            setInterval(fetchData, REFRESH_MS);
        });

        // ── Récupération Intelligente des données depuis l'API ────────────────
        async function fetchData() {
            if (!chartTempHum || !chartPM || !chartNC) return; // Sécurité

            try {
                const valDebut = document.getElementById("dateDebut").value;
                const valFin = document.getElementById("dateFin").value;
                const valRoom = document.getElementById("selectRoom").value;
                const valCapteur = document.getElementById("selectCapteur").value;

                // Construction de l'URL corrigée
                let urlApi = `/api/mesures?room=${valRoom}`; 
                
                if (valDebut && valFin) {
                    urlApi += `&debut=${valDebut}&fin=${valFin}`;
                } else {
                    urlApi += `&heures=24`;
                }

                if (valCapteur !== "all") {
                    urlApi += `&slave=${valCapteur}`;
                }

                const res  = await fetch(urlApi);
                const donnees = await res.json();
                function sousEchantillonner(data, maxPoints) {
                    if (!data || data.length <= maxPoints) return data;
                    
                    const step = Math.ceil(data.length / maxPoints);
                    const result = [];
                    
                    for (let i = 0; i < data.length; i += step) {
                        const bucket = data.slice(i, i + step);
                        
                        // CORRECTION : On cherche la valeur MAXIMALE dans le bucket
                        // pour ne pas "lisser" (effacer) les pics de pollution importants
                        const maxPoint = bucket.reduce((prev, current) => {
                            // Compare par exemple le PM2.5 (mc2p5)
                            return (prev.mc2p5 > current.mc2p5) ? prev : current;
                        });
                        
                        result.push(maxPoint);
                    }
                    
                    return result;
                }
                if (!donnees || !donnees.length) {
                    document.getElementById("status").textContent = "Aucune donnée sur cette période.";
                    return;
                }

                // 1. Valeurs instantanées
                const last = donnees[0];
                document.getElementById("val-temp").textContent   = last.temperature?.toFixed(1) || last.temp?.toFixed(1) || "—";
                document.getElementById("val-hum").textContent    = last.humidity?.toFixed(1)    || last.hum?.toFixed(1)  || "—";
                document.getElementById("val-mc2p5").textContent  = last.mc2p5?.toFixed(2)       || "—";
                document.getElementById("val-mc10p0").textContent = last.mc10p0?.toFixed(2)      || "—";

                // 2. Mise à jour du Tableau Historique
                const corpsTableau = document.getElementById('tableau-mesures');
                corpsTableau.innerHTML = ''; 
                donnees.slice(0, 10).forEach(m => {
                    const date = new Date(m.timestamp).toLocaleString('fr-FR');
                    corpsTableau.innerHTML += `
                        <tr>
                            <td>${date}</td>
                            <td>${m.room}</td>
                            <td>${m.slave}</td>
                            <td>${m.temperature || m.temp || '-'} °C</td>
                            <td>${m.humidity || m.hum || '-'} %</td>
                            <td>${m.mc2p5 || '-'}</td>
                            <td>${m.mc10p0 || '-'}</td>
                        </tr>
                    `;
                });

                // 3. Préparation et mise à jour des Graphiques
                const dataChronologique =  sousEchantillonner([...donnees].reverse(), 300);
                
                const labels = dataChronologique.map(r => {
                    const formatIso = r.timestamp.includes(" ") ? r.timestamp.replace(" ", "T") : r.timestamp;
                    const d = new Date(formatIso);
                    
                    return (valDebut && valFin) ? 
                        `${d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'})} ${r.timestamp.slice(11, 16)}` : 
                        r.timestamp.slice(11, 16);
                });

                chartTempHum.data.labels = labels;
                chartTempHum.data.datasets[0].data = dataChronologique.map(r => r.temperature || r.temp);
                chartTempHum.data.datasets[1].data = dataChronologique.map(r => r.humidity || r.hum);
                chartTempHum.update();

                chartPM.data.labels = labels;
                chartPM.data.datasets[0].data = dataChronologique.map(r => r.mc1p0);
                chartPM.data.datasets[1].data = dataChronologique.map(r => r.mc2p5);
                chartPM.data.datasets[2].data = dataChronologique.map(r => r.mc4p0);
                chartPM.data.datasets[3].data = dataChronologique.map(r => r.mc10p0);
                chartPM.update();

                chartNC.data.labels = labels;
                chartNC.data.datasets[0].data = dataChronologique.map(r => r.nc0p5);
                chartNC.data.datasets[1].data = dataChronologique.map(r => r.nc1p0);
                chartNC.data.datasets[2].data = dataChronologique.map(r => r.nc2p5);
                chartNC.data.datasets[3].data = dataChronologique.map(r => r.nc4p0);
                chartNC.data.datasets[4].data = dataChronologique.map(r => r.nc10p0);
                chartNC.update();

                document.getElementById("status").textContent =
                    `Dernière mise à jour : ${new Date().toLocaleTimeString()} — Affichage optimisé de ${donnees.length} points lissés`;

            } catch (err) {
                document.getElementById("status").textContent = "Erreur de connexion à l'API !";
                console.error(err);
            }
        }

        function reinitialiserDates() {
            document.getElementById("dateDebut").value = "";
            document.getElementById("dateFin").value = "";
            document.getElementById("selectRoom").value = "1";
            document.getElementById("selectCapteur").value = "all";
            fetchData();
        }
    </script>
</body>
</html>
